
name: ci

on:
  push:
  pull_request:

jobs:
  crates:
    name: crates (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # stable for development, nightly because cyber-universe builds with nightly
        toolchain: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          rustup toolchain install ${{ matrix.toolchain }} --profile minimal -c rustfmt,clippy -t x86_64-unknown-none
          rustup default ${{ matrix.toolchain }}
      - name: format
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: host tests (logic + SIMULATED devices)
        run: cargo test --workspace --release
      - name: no_std build for the kernel target
        run: cargo build --workspace --target x86_64-unknown-none --release

  # The former "kernel-integration" job (build cyber-universe with
  # integration/cyber-universe applied) was removed on 2026-10-23:
  # - this workflow's token cannot check out the private cyber-universe repo
  #   (first run: checkout failed);
  # - cyber-universe wrote its own `gpu` command (P6-11), so the patch is
  #   superseded. Integration notes now go to Cyber-hub `integrare/cyber-gpu/`.
