[package]
name = "nvidia-ga104"
description = "NVIDIA GA104 (Ampere, SM 8.6) backend: identification, read-only probe, init plan, firmware inventory, pushbuffer encoding"
version.workspace = true
edition.workspace = true
license-file.workspace = true
authors.workspace = true

[dependencies]
gpu-core.workspace = true
gpu-pci.workspace = true
gpu-command.workspace = true
# I9: the first-fit range allocator (VRAM and GPU VA bookkeeping, M3).
gpu-memory.workspace = true
# Data only (offsets/fields generated from NVIDIA MIT headers), no_std, no deps.
nvidia-rm570.workspace = true
# C-83 I12: the Q8_0 oracle and margin the verdict needs (gpu_compute::q8);
# workspace crate, no_std, its own deps are already ours.
gpu-compute.workspace = true

[dev-dependencies]
gpu-sim.workspace = true

[features]
# Off by default. Only for the workstation window with Adrian present (C-18):
# allows creating gsp::HardwareWritePermit. Nothing uses it yet.
hw-write = []
